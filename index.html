<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amazing Online - МВД Спидран Тренер</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #161920;
            --neon-orange: #ff6600;
            --neon-blue: #00f0ff;
            --neon-purple: #9d00ff;
            --text-color: #ffffff;
            --shadow-orange: 0 0 15px rgba(255, 102, 0, 0.6), 0 0 30px rgba(255, 102, 0, 0.3);
            --shadow-blue: 0 0 15px rgba(0, 240, 255, 0.6), 0 0 30px rgba(0, 240, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Таймер сверху */
        #timer {
            font-size: 2.5rem;
            font-family: monospace;
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0,240,255,0.5);
            margin-top: 30px;
            margin-bottom: auto;
            font-weight: bold;
        }

        /* Игровая зона */
        .game-zone {
            position: relative;
            width: 100%;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: auto;
        }

        /* Карточка персонажа */
        .player-card {
            width: 140px;
            height: 140px;
            background: var(--card-bg);
            border: 2px solid var(--neon-blue);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            box-shadow: var(--shadow-blue);
            z-index: 10;
            cursor: pointer;
        }

        .player-card i {
            font-size: 2.2rem;
            color: var(--neon-blue);
            margin-bottom: 5px;
        }

        .player-card span {
            font-size: 0.75rem;
            font-weight: bold;
        }

        .hint-text {
            font-size: 1rem;
            color: #ffaa00;
            text-shadow: 0 0 5px rgba(255,170,0,0.4);
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        /* КРУГОВОЕ МЕНЮ */
        .radial-menu {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scale(0.6);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.1s ease, opacity 0.1s ease;
        }

        .radial-menu.open {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        /* Сектора меню */
        .menu-item {
            position: absolute;
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background: #1a1d24;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            color: #bbb;
            text-align: center;
            padding: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        /* Позиции по кругу */
        .menu-item:nth-child(1) { top: 0; left: 112px; }    /* Верх */
        .menu-item:nth-child(2) { top: 112px; right: 0; }   /* Право */
        .menu-item:nth-child(3) { bottom: 0; left: 112px; } /* Низ */
        .menu-item:nth-child(4) { top: 112px; left: 0; }    /* Лево */

        /* Фракция (активная цель) */
        .menu-item.target-faction {
            border-color: var(--neon-orange);
            color: #fff;
            box-shadow: var(--shadow-orange);
            background: rgba(255, 102, 0, 0.15);
        }

        /* Подменю фракции */
        .radial-menu.submenu .menu-item.target-action {
            border-color: #ff3333;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
            background: rgba(255, 51, 51, 0.15);
        }

        /* Модалка результатов */
        .result-card {
            background: var(--card-bg);
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 25px rgba(157, 0, 255, 0.5);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 320px;
            width: 100%;
        }

        .result-time {
            font-size: 2.8rem;
            color: var(--neon-orange);
            font-weight: bold;
            margin: 15px 0;
            text-shadow: 0 0 10px rgba(255,102,0,0.5);
        }

        .result-rank {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 25px;
            color: var(--neon-blue);
        }

        .btn-restart {
            background: transparent;
            color: #fff;
            border: 2px solid var(--neon-orange);
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: var(--shadow-orange);
        }
    </style>
</head>
<body>

    <!-- ИГРОВОЙ ЭКРАН (ОТКРЫТ СРАЗУ) -->
    <div id="game-screen" class="screen active">
        <div id="timer">0.000 сек</div>

        <div class="game-zone">
            <!-- Карточка игрока -->
            <div id="player-card" class="player-card">
                <i class="fa-solid fa-user-shield"></i>
                <span>Yamato_Sekade<br>[279]</span>
            </div>

            <!-- Круговое меню -->
            <div id="radial-menu" class="radial-menu"></div>
        </div>

        <div id="hint" class="hint-text">Нажми на игрока, чтобы начать!</div>
    </div>

    <!-- ЭКРАН РЕЗУЛЬТАТОВ -->
    <div id="result-screen" class="screen">
        <div class="result-card">
            <h2>Ваша скорость</h2>
            <div id="final-time" class="result-time">0 мс</div>
            <div id="rank" class="result-rank">-</div>
            <button class="btn-restart" id="restart-btn">Повторить</button>
        </div>
    </div>

    <script>
        let startTime = 0;
        let timerInterval = null;
        let isGameRunning = false;

        const playerCard = document.getElementById('player-card');
        const radialMenu = document.getElementById('radial-menu');
        const timerDisplay = document.getElementById('timer');
        const hintDisplay = document.getElementById('hint');
        const restartBtn = document.getElementById('restart-btn');

        // ОДИН ТАП/КЛИК по игроку — СРАЗУ СТАРТ
        playerCard.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (isGameRunning) return;

            isGameRunning = true;
            playerCard.style.pointerEvents = 'none'; // Блокируем карту, чтобы не мешала тапать меню
            hintDisplay.textContent = "БЫСТРО ЖМИ «ФРАКЦИЯ»!";

            // Старт таймера
            startTime = performance.now();
            timerInterval = setInterval(() => {
                const elapsed = performance.now() - startTime;
                timerDisplay.textContent = (elapsed / 1000).toFixed(3) + ' сек';
            }, 10);

            // Показываем Главное меню
            renderMainMenu();
        });

        // 1 ЭТАП: Главное меню
        function renderMainMenu() {
            radialMenu.innerHTML = `
                <div class="menu-item">Паспорт</div>
                <div class="menu-item target-faction" id="faction-btn">Фракция</div>
                <div class="menu-item">Лицензии</div>
                <div class="menu-item">Обыск</div>
            `;
            radialMenu.className = "radial-menu open";

            // Тап по кнопке Фракция
            document.getElementById('faction-btn').addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                goToSubmenu();
            });
        }

        // 2 ЭТАП: Подменю фракции
        function goToSubmenu() {
            hintDisplay.textContent = "ЖМИ «ЗАДЕРЖАТЬ»!";
            radialMenu.className = "radial-menu open submenu";
            
            radialMenu.innerHTML = `
                <div class="menu-item">Обыскать</div>
                <div class="menu-item">Документы</div>
                <div class="menu-item">Вести за собой</div>
                <div class="menu-item target-action" id="arrest-btn">Задержать</div>
        `;// Тап по кнопке "Задержать" останавливает таймер!document.getElementById('arrest-btn').addEventListener('pointerdown', (e) => {e.preventDefault();e.stopPropagation();finishSpeedrun();});}// Финал и вывод миллисекундfunction finishSpeedrun() {clearInterval(timerInterval);const totalTimeMs = Math.round(performance.now() - startTime);radialMenu.className = "radial-menu"; // закрываем менюisGameRunning = false;// Ранги скорости под Amazing Onlinelet rank = "";if (totalTimeMs <= 280) rank = "⚡ Молниеносный нонРП коп";else if (totalTimeMs <= 450) rank = "⭐ Отличный биндер / Хорошая реакция";else rank = "🐢 Медленный шериф";document.getElementById('final-time').textContent = ${totalTimeMs} мс;document.getElementById('rank').textContent = rank;setTimeout(() => {document.getElementById('game-screen').classList.remove('active');document.getElementById('result-screen').classList.add('active');}, 200);}// Кнопка повтораrestartBtn.addEventListener('pointerdown', (e) => {e.preventDefault();timerDisplay.textContent = '0.000 сек';hintDisplay.textContent = 'Нажми на игрока, чтобы начать!';playerCard.style.pointerEvents = 'auto';radialMenu.innerHTML = '';document.getElementById('result-screen').classList.remove('active');document.getElementById('game-screen').classList.add('active');});
